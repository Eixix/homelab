<!doctype html>
<html lang="de">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="robots" content="noindex,nofollow,noarchive">
        <title>Pizza-Fernschreiber</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="/box.css">
        <link rel="stylesheet" href="/scene-overrides.css">
    </head>

    <body>
        <main>
            <section class="hero">
                <p class="kicker">ESS6 & friends</p>
                <h1>Pizza. Um<br><em>Zwölf.</em></h1>
                <div class="clock">BESTELLSCHLUSS <strong>10:30</strong> EUROPE/BERLIN</div>
            </section>

            <section class="notice" id="closed" hidden><b>DER OFEN IST AUS.</b><span id="closed-copy"></span></section>
            <form id="order-form" hidden>
                <div class="form-head"><label for="name">WER BIST DU?</label><input id="name" maxlength="80"
                        autocomplete="name" required placeholder="Vorname reicht"></div>
                <div id="menu"></div>
                <div class="ticket">
                    <span>DEIN DECKEL</span><strong id="total">0,00 €</strong>
                    <button type="submit">BESTELLUNG ABSCHIESSEN →</button>
                    <button class="danger" id="cancel" type="button" hidden>Meine Bestellung stornieren</button>
                    <p id="status" role="status"></p>
                </div>
            </form>

            <section class="box-stage" id="box-stage" hidden aria-live="polite">
                <canvas id="box-canvas" aria-label="Animierte dreidimensionale Pizzaschachtel"></canvas>
                <span class="box-countdown" id="box-countdown">10:30</span>
                <article class="order-note">
                        <p class="kicker">DEINE BESTELLUNG ✓</p>
                        <h2 id="box-name"></h2>
                        <ul id="box-summary"></ul>
                        <strong id="box-total"></strong>
                        <p id="box-deadline">Bis 10:30 kannst du noch an den Belag.</p>
                        <div class="box-actions" id="box-actions">
                            <button id="edit-order" type="button">Box öffnen &amp; ändern</button>
                            <button class="danger" data-cancel-order type="button">Bestellung stornieren</button>
                        </div>
                        <a id="box-pay" class="pay" hidden>Jetzt Schulden begleichen →</a>
                </article>
            </section>

        </main>
        <script src="/app.js" type="module"></script>
    </body>

</html>
