[general]
static = yes
writeprotect = yes

; Only the fixed registration contact is accepted, never arbitrary numbers.
[from-vodafone]
exten => ivr,1,Goto(ivr,s,1)

[ivr]
exten => s,1,Set(GROUP()=ivr-inbound)
 same => n,GotoIf($[${GROUP_COUNT(ivr-inbound)}>2]?full,1)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,Set(TIMEOUT(digit)=2)
 same => n,Set(TIMEOUT(response)=5)
 same => n,Set(CHANNEL(language)=de)
 same => n,AGI(/usr/local/bin/menu.py,public)
 same => n,Hangup()

exten => full,1,Hangup(17)
; Menu input is handled inside AGI; there is no arbitrary outgoing dialplan.
