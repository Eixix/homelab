[general]
static = yes
writeprotect = yes

; Only the fixed registration contact is accepted, never arbitrary numbers.
[from-vodafone]
exten => ivr,1,Goto(ivr,s,1)

[ivr]
exten => s,1,Set(GROUP()=ivr-inbound)
 same => n,GotoIf($[${GROUP_COUNT(ivr-inbound)}>2]?full,1)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,Set(TIMEOUT(digit)=2)
 same => n,Set(TIMEOUT(response)=5)
 same => n,Set(CHANNEL(language)=de)
 same => n,Set(ATTEMPTS=0)
 same => n,Background(custom/greeting)
 same => n,WaitExten(5)
 same => n,Goto(t,1)

exten => 1,1,AGI(/usr/local/bin/menu.py,forward,annika)
 same => n,Hangup()

exten => 2,1,AGI(/usr/local/bin/menu.py,forward,tobias)
 same => n,Hangup()

exten => 9,1,AGI(/usr/local/bin/menu.py,home)
 same => n,Hangup()

exten => full,1,Hangup(17)

exten => i,1,Set(ATTEMPTS=$[${ATTEMPTS}+1])
 same => n,GotoIf($[${ATTEMPTS}>=3]?t,1)
 same => n,Background(custom/invalid)
 same => n,WaitExten(5)
 same => n,Goto(t,1)

exten => t,1,Playback(custom/goodbye)
 same => n,Hangup()

; Only fixed configured forwarding targets; no arbitrary outgoing dialplan.
