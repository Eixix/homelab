; Local Linux host only. No registration, credentials or external listener.
[global]
type = global
endpoint_identifier_order = ip

[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5060

[local-test]
type = endpoint
transport = transport-udp
context = from-vodafone
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no

[local-test-identify]
type = identify
endpoint = local-test
match = 127.0.0.1/32
