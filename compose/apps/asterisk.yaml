services:
  asterisk:
    container_name: asterisk
    build:
      context: ../../apps/asterisk
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    environment:
      ASTERISK_ANNIKA_NUMBER: ${ASTERISK_ANNIKA_NUMBER:-}
      ASTERISK_TOBIAS_NUMBER: ${ASTERISK_TOBIAS_NUMBER:-}
      ASTERISK_MENU_PIN: ${ASTERISK_MENU_PIN:-}
      ASTERISK_HA_URL: ${ASTERISK_HA_URL:-http://127.0.0.1:8123}
      ASTERISK_HA_TOKEN: ${ASTERISK_HA_TOKEN:-}
      ASTERISK_HA_KITCHEN_ENTITY: ${ASTERISK_HA_KITCHEN_ENTITY:-}
      TZ: ${TZ:-Europe/Berlin}
      ASTERISK_DTMF_MODE: ${ASTERISK_DTMF_MODE:-auto}
      ASTERISK_MODE: ${ASTERISK_MODE:-local}
      ASTERISK_BIND: ${ASTERISK_BIND:-}
      ASTERISK_REGISTRATION_EXPIRATION: ${ASTERISK_REGISTRATION_EXPIRATION:-3600}
      ASTERISK_REGISTRAR: ${ASTERISK_REGISTRAR:-}
      ASTERISK_SIP_USER: ${ASTERISK_SIP_USER:-}
      ASTERISK_SIP_DOMAIN: ${ASTERISK_SIP_DOMAIN:-}
      ASTERISK_AUTH_USERNAME: ${ASTERISK_AUTH_USERNAME:-}
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:-}
      ASTERISK_INBOUND_SBC: ${ASTERISK_INBOUND_SBC:-}
      ASTERISK_OUTBOUND_PROXY: ${ASTERISK_OUTBOUND_PROXY:-}
      ASTERISK_LOCAL_NET: ${ASTERISK_LOCAL_NET:-}
      ASTERISK_PUBLIC_IP: ${ASTERISK_PUBLIC_IP:-}
    volumes:
      - ../../data/asterisk/db:/var/lib/asterisk/db
      - ivr-status-socket:/run/ivr-status:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /run/asterisk:mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python3, /usr/local/bin/asterisk-healthcheck.py]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      - traefik.enable=false

  asterisk-status:
    container_name: asterisk-status
    build:
      context: ../../apps/asterisk-status
    restart: unless-stopped
    network_mode: none
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ivr-status-socket:/run/ivr-status
      - ../../data/asterisk-status:/status:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: [CMD, python3, /app/status.py, health]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - traefik.enable=false

volumes:
  ivr-status-socket:
